<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Admin - Login</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
    <script src="js/admin-core.js"></script>
</head>

<body class="bg-gradient-primary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-6 col-lg-8 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-5">
                        <div class="text-center">
                            <h1 class="h4 text-gray-900 mb-4">¡Bienvenido!</h1>
                        </div>
                        <div id="mensaje"></div>
                        <form class="user" id="form-login">
                            <div class="form-group">
                                <input type="text" class="form-control form-control-user" id="usuario" placeholder="Usuario" required>
                            </div>
                            <div class="form-group">
                                <input type="password" class="form-control form-control-user" id="contrasena" placeholder="Contraseña" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-user btn-block">Ingresar</button>
                        </form>
                        <hr>
                        <div class="text-center">
                            <a class="small" href="register.html">Crear una cuenta (vendedor)</a>
                        </div>
                        <div class="text-center">
                            <a class="small" href="../SRC/index.html">Ir a la tienda</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
